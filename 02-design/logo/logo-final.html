<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
 main { max-width: 1120px; margin: 0 auto; padding: var(--space-8) var(--space-4); display: grid; gap: var(--space-6); }

 .row div { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); display: grid; place-items: center; padding: var(--space-4); }
 .row img { height: 96px; width: auto; }

<main>
 <h1>لوگوی هم‌مسیر</h1>

 <div class="row">
  <div><img src="logo-final.png" alt=""></div>
  <div style="background:var(--surface)"><img src="logo-final.png" alt=""></div>
  <div><img src="logo-final.png" alt="" style="height:48px"></div>
 </div>
