<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewBox" content="">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هم‌مسیر · لوگو، طرح جاده و کمان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../contracts/tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  main { max-width: 1040px; }
  .row2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--space-4); }
  .tile { display: flex; align-items: center; justify-content: center; gap: var(--space-4); padding: var(--space-8) var(--space-4); border-radius: var(--radius-lg); }
  .light { background: var(--surface-raised); border: 1px solid var(--line); color: var(--brand); --second: var(--accent); }
  .dark { background: var(--brand); color: var(--on-brand); --second: var(--accent); }
  .mono { background: var(--surface-raised); border: 1px solid var(--line); color: var(--ink); --second: var(--ink); }
  .stack-l { flex-direction: column; gap: var(--space-2); }
  .word { font-weight: 800; line-height: 1; }
  .tag { display: flex; align-items: center; gap: var(--space-3); font-size: var(--small-size); font-weight: 500; color: var(--ink-muted); }
  .tag::before, .tag::after { content: ""; width: 28px; height: 2px; background: var(--accent); border-radius: 2px; }
  .dark .tag { color: rgba(255,255,255,.8); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-top: var(--space-4); }
  .icon { width: 96px; height: 96px; border-radius: 22px; background: var(--brand); display: grid; place-items: center; color: var(--on-brand); --second: var(--accent); }
  .sizes { display: flex; gap: var(--space-4); align-items: center; justify-content: center; color: var(--brand); --second: var(--accent); }
  h2 { margin-top: var(--space-8); }
  @media (max-width: 800px) { .row2, .grid3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M27 60C27 44 43 46 43 32C43 26 44 22 45 18" fill="none" stroke="#000" stroke-width="2.6" stroke-dasharray="6 5"/>
  </mask>
  <symbol id="mark" viewBox="-4 -8 72 72">
    <!-- کمان حلقهٔ امتیاز -->
    <path d="M5 44A29 29 0 0 1 56 16" fill="none" stroke="var(--second)" stroke-width="5" stroke-linecap="round"/>
    <!-- جاده -->
    <path mask="url(#cut)" fill="currentColor" d="M12 60C12 44 33 46 33 32C33 26 35 22 38 16L50 18C47 24 48 28 48 32C48 46 42 50 42 60Z"/>
  </symbol>
</defs></svg>

<main>
  <h1>لوگوی هم‌مسیر · طرح جاده و کمان</h1>
  <p class="sub">همان مفهوم نمونهٔ تو، ساده و تخت و با رنگ‌های برندگاید.</p>

  <div class="row2">
    <div class="tile light stack-l" style="padding:var(--space-12) var(--space-4)">
      <svg width="140" height="140"><use href="#mark"/></svg>
      <span class="word" style="font-size:56px">هم‌مسیر</span>
      <span class="tag">از رزومه تا مصاحبه، یک قدم جلوتر</span>
    </div>
    <div style="display:grid;gap:var(--space-4)">
      <div class="tile light"><svg width="72" height="72"><use href="#mark"/></svg><span class="word" style="font-size:44px">هم‌مسیر</span></div>
      <div class="tile dark"><svg width="72" height="72"><use href="#mark"/></svg><span class="word" style="font-size:44px">هم‌مسیر</span></div>
    </div>
  </div>

  <h2>اندازهٔ کوچک، تک‌رنگ و آیکون</h2>
  <div class="grid3">
    <div class="card"><div class="sizes"><svg width="16" height="16"><use href="#mark"/></svg><svg width="24" height="24"><use href="#mark"/></svg><svg width="32" height="32"><use href="#mark"/></svg><svg width="48" height="48"><use href="#mark"/></svg><svg width="64" height="64"><use href="#mark"/></svg></div><p class="small muted" style="text-align:center;margin:var(--space-3) 0 0">۱۶ تا ۶۴ پیکسل</p></div>
    <div class="card mono" style="display:grid;place-items:center"><svg width="72" height="72"><use href="#mark"/></svg><p class="small muted" style="margin:var(--space-2) 0 0">تک‌رنگ (برای چاپ سیاه‌وسفید)</p></div>
    <div class="card" style="display:grid;place-items:center"><div class="icon"><svg width="64" height="64"><use href="#mark"/></svg></div><p class="small muted" style="margin:var(--space-2) 0 0">آیکون برنامه</p></div>
  </div>
</main>
</body>
</html>
